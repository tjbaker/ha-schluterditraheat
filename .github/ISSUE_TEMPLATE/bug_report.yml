name: Bug Report
description: Report a bug (not related to login or connection issues)
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug!

        **Note**: For login, session-limit or connection problems, please use the [Connection Issue](https://github.com/tjbaker/ha-schluterditraheat/issues/new?template=connection_issue.yml) template instead.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: What's the bug? What did you expect to happen?
      placeholder: |
        Example: Setting the thermostat to Heat from Home Assistant leaves the floor off.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this bug?
      placeholder: |
        1. Open the thermostat card in Home Assistant
        2. Change the mode from Off to Heat
        3. Check the Schluter app - thermostat is still off
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen?
      placeholder: The thermostat switches to manual heating at the set temperature
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happens?
      placeholder: The entity briefly shows Heat, then reverts to Off on the next update
    validations:
      required: true

  - type: input
    id: thermostat-model
    attributes:
      label: Thermostat Model
      description: Shown in the Schluter app or on the thermostat label
      placeholder: "DITRA-HEAT-E-RS1"
    validations:
      required: true

  - type: input
    id: ha-version
    attributes:
      label: Home Assistant Version
      placeholder: "2026.9.3"
    validations:
      required: true

  - type: input
    id: integration-version
    attributes:
      label: Integration Version
      placeholder: "1.2.0"
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics File (Optional)
      description: |
        If your version supports it, attach a diagnostics file:
        1. Go to **Settings** → **Devices & Services** → **Schluter DITRA-HEAT** → **⋮** → **Download Diagnostics**
        2. Attach the JSON file here
      placeholder: Drag and drop diagnostics JSON file here
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs (Optional)
      description: |
        Enable debug logging:
        ```yaml
        logger:
          default: info
          logs:
            custom_components.schluterditraheat: debug
        ```
        Then restart Home Assistant and reproduce the issue.
      placeholder: Paste relevant logs here
      render: shell
    validations:
      required: false

  - type: dropdown
    id: affects-version
    attributes:
      label: Did This Work in a Previous Version?
      options:
        - This is a new issue
        - This worked in a previous version (regression)
        - I don't know
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Any other relevant information
      placeholder: |
        - Number of thermostats: 2
        - Sensor mode: floor
        - Other observations: Only happens while a schedule is active
    validations:
      required: false
