name: Feature Request
description: Suggest a new feature or enhancement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! 
        
        Please provide details about what you'd like to see added or improved.

  - type: textarea
    id: problem
    attributes:
      label: Problem or Use Case
      description: What problem would this feature solve? What's your use case?
      placeholder: |
        Example: I want to track how much energy my floor heating uses, but there's no energy sensor.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would you like this feature to work?
      placeholder: |
        Example: Add an energy sensor that works with the Home Assistant Energy dashboard.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative solutions or workarounds?
      placeholder: |
        Example: I could estimate energy from the heating output sensor, but the cloud already reports real usage.
    validations:
      required: false

  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      description: What area does this feature relate to?
      options:
        - Thermostat control (modes, presets, setpoints)
        - Schedules
        - Energy and power
        - Sensors (new sensor entities)
        - Automations (triggers, conditions, actions)
        - Configuration (new options)
        - Diagnostics (troubleshooting, logging)
        - Performance (speed, efficiency)
        - User Interface (cards, UI improvements)
        - Other
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority (Your Opinion)
      description: How important is this feature to you?
      options:
        - Nice to have
        - Would be useful
        - Would significantly improve my experience
        - Critical for my use case
    validations:
      required: false

  - type: textarea
    id: examples
    attributes:
      label: Examples
      description: |
        Provide examples of how this feature would be used.
        If applicable, include:
        - Example automations
        - Screenshot mockups
        - Links to similar features in other integrations
      placeholder: |
        Example automation:
        ```yaml
        automation:
          - trigger:
              platform: numeric_state
              entity_id: sensor.master_bath_heating_output
              above: 90
              for: "02:00:00"
            action:
              service: notify.mobile_app
              data:
                message: "Bathroom floor has been heating at full output for 2 hours"
        ```
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Any other information that might be relevant
      placeholder: |
        - Similar feature in other integrations: Sinopé Neviweb integration exposes this
        - Technical considerations: Consumption data is published by the cloud with a delay
        - Related issues: #123
    validations:
      required: false

