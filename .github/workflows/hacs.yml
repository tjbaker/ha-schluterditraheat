name: HACS

on:
  push:
    branches:
      - master
    paths:
      - 'custom_components/schluterditraheat/**'
      - 'hacs.json'
      - 'README.md'
      - '.github/workflows/hacs.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'custom_components/schluterditraheat/**'
      - 'hacs.json'
      - 'README.md'
      - '.github/workflows/hacs.yml'
  schedule:
    - cron: '0 6 * * 1'

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: "integration"

