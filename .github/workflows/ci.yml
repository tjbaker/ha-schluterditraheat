name: CI

on:
  # Run on pushes to master (and tags), not on feature branches
  push:
    branches:
      - master
    tags:
      - 'v*'
  # Run for PRs targeting master
  pull_request:
    branches:
      - master

# Avoid duplicate parallel runs for the same ref/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install -U pip setuptools wheel
          pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check --force-exclude custom_components/schluterditraheat tests

      - name: Black (format check)
        run: |
          set -euo pipefail
          FILES=$(find custom_components/schluterditraheat tests -type f -name '*.py' -print || true)
          if [ -z "$FILES" ]; then
            echo "No target Python files. Skipping Black."
            exit 0
          fi
          python -m black --check --diff --color $FILES

      - name: Mypy (type check)
        run: |
          set -euo pipefail
          mypy --check-untyped-defs --exclude 'venv|\.venv|examples' custom_components/schluterditraheat

      - name: Pytest (with coverage)
        run: pytest -q --cov=custom_components/schluterditraheat --cov-report=xml --cov-report=term-missing --cov-fail-under=75

