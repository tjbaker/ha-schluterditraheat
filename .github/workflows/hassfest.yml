name: Hassfest

on:
  push:
    branches:
      - master
    paths:
      - 'custom_components/**'
      - 'custom_components/**/manifest.json'
      - '.github/workflows/hassfest.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'custom_components/**'
      - 'custom_components/**/manifest.json'
      - '.github/workflows/hassfest.yml'
  schedule:
    - cron: '0 6 * * 1'

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run hassfest
        uses: home-assistant/actions/hassfest@master

